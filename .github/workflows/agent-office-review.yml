name: Agent Office Review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-office-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  security-review:
    name: Escritório — Segurança & Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisor de Segurança & Qualidade
        run: bash scripts/agent-review.sh --only security --base "$BASE_REF"

  build-review:
    name: Escritório — Testes & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            whatsapp-financas-web/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: whatsapp-financas-web

      - name: Revisor de Testes & Build
        run: bash scripts/agent-review.sh --only quality --base "$BASE_REF"
